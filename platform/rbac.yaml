apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-release
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rag-live"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-release
subjects:
  - kind: ServiceAccount
    name: rag-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rag-release
